# =====================================================================
# CI/CD — P26-2A-B560-8204-9850-C4B0
# Projeto #28 — Livro de Receitas Colaborativo com Escalonador de Porções
#
# Projeto isolado na subpasta P26-2A-B560-8204-9850-C4B0/ deste fork.
# Free Tier: 1 banco D1 remoto, builds apenas em push na main.
# =====================================================================
name: CI/CD P26-2A-B560-8204-9850-C4B0

on:
  push:
    branches:
      - main
    paths:
      - 'P26-2A-B560-8204-9850-C4B0/**'
      - '.github/workflows/ci-deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'P26-2A-B560-8204-9850-C4B0/**'
      - '.github/workflows/ci-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # 1) Validação: migrações D1 locais + suíte de testes (sem secrets)
  # -------------------------------------------------------------------
  build-test:
    name: Build & Test (D1 local)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: P26-2A-B560-8204-9850-C4B0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Apply D1 migrations locally
        run: npx wrangler d1 migrations apply DB --local

      - name: Run test suite
        run: |
          if [ -d tests ]; then
            node --test tests/
          else
            echo "sem testes"
          fi

  # -------------------------------------------------------------------
  # 2) Deploy: D1 remoto + Cloudflare Pages (somente main/dispatch)
  # -------------------------------------------------------------------
  deploy:
    name: Deploy Cloudflare Pages & D1
    needs: build-test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production-cloudflare
    defaults:
      run:
        working-directory: P26-2A-B560-8204-9850-C4B0
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy public --project-name=p26-2a-b560-8204-9850-c4b0 --branch=main
